<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>🦜 Polyglot - Piratical PyScript</title>
    <link
      rel="stylesheet"
      href="https://pyscript.net/releases/2026.7.3/core.css"
    />
    <script
      type="module"
      src="https://pyscript.net/releases/2026.7.3/core.js"
    ></script>
  </head>
  <body>
    <h1>Polyglot 🦜 💬 🇬🇧 ➡️ 🏴‍☠️</h1>
    <p>Translate English into Pirate speak...</p>
    <input type="text" id="english" placeholder="Type English here..." />
    <button id="translate-button">Translate</button>
    <div id="output"></div>
    <script type="py" config='{"packages": ["arrr"]}'>
import arrr
from pyscript import web, when


@when("click", "#translate-button")
def translate_english(event):
    """
    Translate English text to Pirate speak.
    """
    input_text = web.page["english"]
    english = input_text.value
    output_div = web.page["output"]
    output_div.innerText = arrr.translate(english)
    </script>
  </body>
</html>
